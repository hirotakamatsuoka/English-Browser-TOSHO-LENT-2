<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>ブックマーク</title>
<link rel="stylesheet" href="pbrowser://assets/common.css">
<style>
.item{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:6px}
.item:hover{background:#eceff1}
.item .ti{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ho{color:var(--sub);flex:none;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item button{border:0;background:transparent;padding:6px 14px;min-height:36px;color:var(--sub)}
</style></head>
<body><div class="page">
 <h1>ブックマーク</h1>
 <p class="muted">ページを開いて Ctrl+D（またはアドレスバーの星）で追加できます。</p>
 <div id="list"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const hostOf=u=>{try{return new URL(u).host}catch{return u}};
async function load(){
  const items=await api.invoke('bookmarks:list');
  const box=$('list'); box.textContent='';
  if(!items.length){ const p=document.createElement('p'); p.className='empty'; p.textContent='ブックマークはまだありません。'; box.appendChild(p); return; }
  for(const b of items){
    const row=document.createElement('div'); row.className='item';
    const a=document.createElement('a'); a.className='ti'; a.href=b.url; a.textContent=b.title||b.url;
    const ho=document.createElement('span'); ho.className='ho'; ho.textContent=hostOf(b.url);
    const x=document.createElement('button'); x.textContent='削除'; x.onclick=async()=>{ await api.invoke('bookmarks:delete',b.id); load(); };
    row.append(a,ho,x); box.appendChild(row);
  }
}
api.on('bookmarks:changed',load);
load();
</script></body></html>
