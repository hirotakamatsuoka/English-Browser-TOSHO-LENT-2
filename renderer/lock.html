<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>利用時間外</title>
<link rel="stylesheet" href="pbrowser://assets/common.css">
<style>
body{display:flex;align-items:center;justify-content:center;height:100vh;background:#eceff1;text-align:center}
.box{max-width:480px;padding:0 24px}
h1{font-size:26px;margin-bottom:8px}
.t{font-size:44px;font-weight:300;margin:18px 0 6px;font-variant-numeric:tabular-nums}
</style></head>
<body><div class="box">
<h1>いまは利用できない時間です</h1>
<p class="muted">利用できる時間：<span id="range">—</span></p>
<div class="t" id="now"></div>
<p class="muted">時間になると自動で使えるようになります。</p>
</div>
<script>
const $=id=>document.getElementById(id);
function tick(){ const d=new Date(); $('now').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0'); }
tick(); setInterval(tick,10000);
api.on('lock:info',i=>{$('range').textContent=i.label;});
api.invoke('lock:info').then(i=>{$('range').textContent=i.label;});
</script></body></html>
